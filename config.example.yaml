# Пример конфигурации Video to Circle Bot.
# Скопируйте в config.yaml и заполните своими значениями:
#   cp config.example.yaml config.yaml
# config.yaml добавлен в .gitignore — реальные токены в репозиторий не попадают.
# Все статические настройки задаются только здесь; переменные окружения не используются.
# Динамика (подписки, статистика, ссылка на канал проверки) хранится в SQLite, не тут.

bot:
  # Токен от @BotFather (формат «123456:AA…»).
  token: "1234567890:AAAA-EXAMPLE-TOKEN-REPLACE-ME"
  # ID администраторов: видят админ-команды и получают Pro-лимиты. Узнать ID: @userinfobot.
  admin_ids: [123456789]

# Язык по умолчанию для новых пользователей.
# Доступны: ru | en | uk | kk | uz | es | de | fr | pt | tr.
# Используется, если язык клиента Telegram не из списка (иначе язык определяется автоматически).
default_language: "ru"

channel:
  # Текст кнопки «вступить» в окне проверки подписки на канал/чат.
  invite_text: "Вступить в канал"

# Тарифы. free — базовый, pro — платный (покупается за Telegram Stars).
# Лимиты каждого тарифа описываются одинаковым набором полей.
plans:
  free:
    # Максимальный размер исходного видео, MB. 0 = без ограничения
    # (тогда предел задаёт сам Bot API: 20 MB в облачном режиме).
    max_size_mb: 15
    # Максимальная длительность исходника, сек (1..60). Дольше — только через /fragment.
    max_duration_sec: 60
    # Доступные разрешения кружка: квадрат, чётные числа 2..640. Меньше = быстрее и легче.
    resolutions: [360]
    # Разрешение по умолчанию; обязано входить в resolutions.
    default_resolution: 360
    # crf — качество кодирования: 0 (максимум, огромный файл) … 51 (минимум), меньше = лучше.
    # На скорость влияет слабо (весь диапазон — ~1.1×), зато сильно на размер файла.
    # Ориентиры: 18–23 — высокое, 24–30 — среднее, 36 и выше — уже заметная потеря.
    crf: 30
    # preset — скорость кодирования x264 при том же качестве (crf), а не само качество.
    # Варианты (от быстрого к медленному):
    #   ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow
    # Чем быстрее — тем меньше CPU, тем больше кбит/с уходит на ту же картинку.
    # Быстрые preset'ы раздувают файл, поэтому годятся только на малых разрешениях:
    # при 640×640 ultrafast/superfast выходят за потолок видео-сообщения 12 MB.
    preset: "ultrafast"
    # Конвертаций в сутки на пользователя. 0 = без дневного лимита.
    daily_limit: 5
    # Максимум видео в одном сообщении (альбом). 0 = без ограничения.
    max_album: 3
  pro:
    # 0 = без ограничения по размеру (потолок задаёт Bot API).
    max_size_mb: 0
    max_duration_sec: 60
    # 640 убран: с быстрым preset'ом такой кружок не влезает в 12 MB видео-сообщения.
    resolutions: [360, 480]
    default_resolution: 480
    # crf — как у free (0…51, меньше = лучше); здесь чуть выше качеством.
    crf: 28
    # preset — варианты и смысл см. у plans.free.preset.
    preset: "ultrafast"
    # 0 = без дневного лимита.
    daily_limit: 0
    # 0 = без ограничения на число видео в сообщении.
    max_album: 0

# Цены в Telegram Stars (XTR). stars — целое число звёзд (без ×100).
# lifetime: true — бессрочная подписка (days игнорируется, ставьте 0).
prices:
  - {code: "pro_30d",  plan: "pro", days: 30, stars: 25}
  - {code: "pro_90d",  plan: "pro", days: 90, stars: 60}
  - {code: "pro_life", plan: "pro", days: 0,  stars: 150, lifetime: true}

# Bot API. По умолчанию — облачный. Для файлов больше 20 MB нужен собственный
# telegram-bot-api с --local и общий каталог файлов по одинаковому абсолютному пути.
api:
  # Origin локального сервера (только при local: true), например http://bot-api:8081.
  base_url: ""
  # true — использовать локальный Bot API вместо облачного.
  local: false

# Анти-спам на команду /paysupport (она пересылает текст всем администраторам).
support:
  # Пауза между обращениями одного пользователя, сек. 0 = без паузы.
  cooldown_sec: 120
  # Обращений в сутки на пользователя. 0 = без лимита.
  daily_limit: 3

# Обработка видео и фоновые задачи.
processing:
  # Сколько конвертаций выполнять одновременно (пропускная способность для многих людей).
  # Каждая занимает ядра: держите workers × threads примерно равным числу доступных ядер.
  workers: 1
  # Потоков ffmpeg на ОДНУ конвертацию. 1 — оптимум для preset ultrafast:
  # потоки там только мешают (замерено 480p: 1.78 с на одном против 2.02 с на двух).
  # На медленных preset'ах потоки помогают — veryfast 1.26×, medium 1.90×, тогда 2–4.
  # 0 = авто: половина бюджета CPU (квота контейнера, cgroup cpu.max), но не больше
  # видимых ядер. Квоту (cpus в docker-compose.yml) держите минимум вдвое больше
  # threads, иначе потоки упираются в троттлинг квоты и работают МЕДЛЕННЕЕ.
  threads: 1
  # Максимум ожидающих пачек в очереди (сверх выполняющихся workers).
  queue_size: 20
  # Таймаут ffprobe (анализ входного файла), сек.
  probe_timeout_sec: 15
  # Таймаут одной конвертации и отправки, сек.
  encode_timeout_sec: 120
  # Сколько ждать завершения принятых задач при остановке, сек.
  shutdown_timeout_sec: 30
  # Каталог временных файлов (отдельный от системного /tmp), путь относительно main.py.
  temp_dir: "data/tmp"

# Логирование. Уровень: DEBUG | INFO | WARNING | ERROR | CRITICAL.
logging:
  level: "INFO"
