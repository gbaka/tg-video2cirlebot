# Пример конфигурации Video to Circle Bot.
# Скопируйте в config.yaml и заполните своими значениями:
#   cp config.example.yaml config.yaml
# config.yaml добавлен в .gitignore — реальные токены в репозиторий не попадают.

bot:
  # Токен от @BotFather
  token: "1234567890:AAAA-EXAMPLE-TOKEN-REPLACE-ME"
  # ID администраторов (узнать через @userinfobot)
  admin_ids: [123456789]

# Язык по умолчанию для новых пользователей. Доступны: ru | en | uk | kk | uz | es | de | fr | pt | tr.
# Используется, если язык клиента Telegram не из списка (иначе язык определяется автоматически).
default_language: "ru"

channel:
  # Текст кнопки для вступления в канал/чат
  invite_text: "Вступить в канал"

# Тарифы. free — базовый, pro — платный (покупается за Telegram Stars).
plans:
  free:
    max_size_mb: 15          # максимальный размер исходного видео, MB (0 = без лимита)
    max_duration_sec: 60     # максимальная длительность
    resolutions: [360]       # доступные разрешения кружка
    default_resolution: 360
    crf: 24                  # качество (меньше = лучше)
    preset: "fast"
    daily_limit: 5           # конвертаций в день (0 = без лимита)
    max_album: 3             # видео в одном сообщении (0 = без лимита)
  pro:
    max_size_mb: 0           # 0 = без ограничения: потолок задаёт сам Bot API (20 MB в облаке)
    max_duration_sec: 60
    resolutions: [360, 480, 640]
    default_resolution: 480
    crf: 20
    preset: "medium"
    daily_limit: 0
    max_album: 0             # 0 = без ограничения

# Цены в Telegram Stars (XTR)
prices:
  - {code: "pro_30d",  plan: "pro", days: 30, stars: 25}
  - {code: "pro_90d",  plan: "pro", days: 90, stars: 60}
  # lifetime: true — бессрочная подписка (days игнорируется)
  - {code: "pro_life", plan: "pro", days: 0,  stars: 150, lifetime: true}

# Облачный Bot API — по умолчанию. Для больших файлов нужен собственный
# telegram-bot-api --local и общий каталог файлов по одинаковому абсолютному пути.
api:
  base_url: ""              # например http://bot-api:8081
  local: false

support:                     # лимиты против спама в /paysupport
  cooldown_sec: 120          # пауза между обращениями, сек (0 = без паузы)
  daily_limit: 3             # обращений в сутки (0 = без лимита)

processing:
  workers: 1                # параллельных задач; для 1 CPU / 512 MB оставьте 1
  queue_size: 20            # максимальное число ожидающих пачек
  probe_timeout_sec: 15
  encode_timeout_sec: 120
  shutdown_timeout_sec: 30
  temp_dir: "data/tmp"      # отдельный каталог; путь относительно main.py

logging:
  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
